openapi: 3.0.0
info:
  title: Walkr Stats API
  description: Aggregate statistics calculated from the events stored by the platform
  version: "1.0.0"
paths:
  /stats:
    get:
      summary: Get the aggregate statistics
      operationId: pythia.get_stats
      responses:
        '200':
          description: Current statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingStats'
        '503':
          description: the statistics store is unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

components:
  schemas:
    ProcessingStats:
      type: object
      required:
        - num_distance_events
        - num_steps_events
        - min_distance
        - max_distance
        - min_steps
        - max_steps
        - last_updated_distance
        - last_updated_steps
      properties:
        num_distance_events:
          type: integer
          example: 203
        num_steps_events:
          type: integer
          example: 200
        min_distance:
          type: number
          nullable: true
          example: 0.4
        max_distance:
          type: number
          nullable: true
          example: 42.1
        min_steps:
          type: integer
          nullable: true
          example: 120
        max_steps:
          type: integer
          nullable: true
          example: 31000
        last_updated_distance:
          type: string
          nullable: true
          description: recorded_timestamp of the newest distance event processed
          example: "2026-10-27T17:59:00.123456"
        last_updated_steps:
          type: string
          nullable: true
          description: recorded_timestamp of the newest steps event processed
          example: "2026-10-27T17:59:00.654321"