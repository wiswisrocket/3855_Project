openapi: 3.0.0
info:
  version: 1.0.0
  title: Walkr
  description: A sample API to illustrate OpenAPI concepts
paths:
  /events/distance:
    post:
      summary: Reports a single walking/running session distance
      operationId: receiver.report_distance
      description: Adds a session distance event
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionDistance'
      responses:
        '201':
          description: session distance successfully received
        '400':
          description: invalid input, object invalid

  /events/steps:
    post:
      summary: Reports a single walking/running session step count
      operationId: receiver.report_steps
      description: Adds a session steps event
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionSteps'
      responses:
        '201':
          description: session steps successfully received
        '400':
          description: invalid input, object invalid

components:
  schemas:
    SessionDistance:
      type: object
      required:
        - device_id
        - distance
        - timestamp
      properties:
        device_id:
          type: string
          format: uuid
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
        distance:
          type: number
          example: 5.2
        timestamp:
          type: string
          format: date-time
          example: "2016-08-29T09:12:33.001Z"

    SessionSteps:
      type: object
      required:
        - device_id
        - steps
        - timestamp
      properties:
        device_id:
          type: string
          format: uuid
          example: "d290f1ee-6c54-4b01-90e6-d701748f0851"
        steps:
          type: integer
          example: 6000
        timestamp:
          type: string
          format: date-time
          example: "2016-08-29T09:12:33.001Z"