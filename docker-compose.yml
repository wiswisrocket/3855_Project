services:
  db:
    container_name: db
    image: mysql:8
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 1
      MYSQL_USER: walkr_user
      MYSQL_PASSWORD: walkr_passwd
      MYSQL_DATABASE: walkr_db
      TZ: America/Vancouver
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12

  storage:
    container_name: storage
    build:
      context: storage
    environment:
      DATABASE_URL: mysql://walkr_user:walkr_passwd@db/walkr_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/status"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8090:8090"   # Swagger UI at localhost:8090/ui for the defense
    restart: unless-stopped

  storage-worker:
    container_name: storage-worker
    build:
      context: storage
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: mysql://walkr_user:walkr_passwd@db/walkr_db
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_1: distance
      KAFKA_TOPIC_2: steps
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  receiver:
    container_name: receiver
    build:
      context: receiver
    environment:
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC_1: distance
      KAFKA_TOPIC_2: steps
    depends_on:
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8080:8080"
    restart: unless-stopped

  redis:
    container_name: redis
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  hermes:
    container_name: hermes
    build:
      context: hermes
    environment:
      STORAGE_URL: http://storage:8090
      REDIS_URL: redis://redis:6379
      POLL_INTERVAL_SECONDS: 5
    depends_on:
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  pythia:
    container_name: pythia
    build:
      context: pythia
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/stats"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8011:8011"
    restart: unless-stopped

  redpanda:
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092

      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081

      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145

      - --mode dev-container

      - --smp 1
      - --default-log-level=info
      - --set redpanda.auto_create_topics_enabled=true
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.10
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  redpanda-console:
    container_name: redpanda-console
    image: docker.redpanda.com/redpandadata/console:v3.7.4
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8085:8080"
    depends_on:
      - redpanda

  # --- Observability (Lab 11) ---

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"   # optional: lets you show Status -> Targets during the demo
    depends_on:
      - redpanda

  loki:
    container_name: loki
    image: grafana/loki:latest

  alloy:
    container_name: alloy
    image: grafana/alloy:latest
    ports:
      - "12345:12345"
    volumes:
      - ./prometheus/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - loki

  grafana:
    container_name: grafana
    image: grafana/grafana:13.1.3
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_SECURITY_ADMIN_PASSWORD=password
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki

volumes:
  db_data:
  redis_data:
  redpanda:
  grafana-storage:
