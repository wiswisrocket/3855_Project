services:
  db:
    image: mysql:8
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 1
      MYSQL_USER: walkr_user
      MYSQL_PASSWORD: walkr_passwd
      MYSQL_DATABASE: walkr_db
      TZ: America/Vancouver
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12

  storage:
    build:
      context: storage
    environment:
      DATABASE_URL: mysql://walkr_user:walkr_passwd@db/walkr_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/status"]
      interval: 5s
      timeout: 5s
      retries: 5

  receiver:
    build:
      context: receiver
    environment:
      STORAGE_SERVICE_URL: http://storage:8090
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8080:8080"

volumes:
  db_data: