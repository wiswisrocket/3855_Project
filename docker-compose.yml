services:
  db:
    image: mysql:8
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 1
      MYSQL_USER: walkr_user
      MYSQL_PASSWORD: walkr_passwd
      MYSQL_DATABASE: walkr_db
      TZ: America/Vancouver
    ports:
      - 3306:3306

  receiver:
    image: 
    
  storage:
    build:
      context: storage
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: mysql://walkr_user:walkr_passwd@localhost/walkr_db