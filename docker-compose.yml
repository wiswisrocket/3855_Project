services:
  db:
    container_name: mnemosyne
    image: mysql:8
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 1
      MYSQL_USER: walkr_user
      MYSQL_PASSWORD: walkr_passwd
      MYSQL_DATABASE: walkr_db
      TZ: America/Vancouver
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12

  storage:
    container_name: storage
    build:
      context: storage
    environment:
      DATABASE_URL: mysql://walkr_user:walkr_passwd@db/walkr_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/status"]
      interval: 5s
      timeout: 5s
      retries: 5

  receiver:
    container_name: receiver
    build:
      context: receiver
    environment:
      STORAGE_SERVICE_URL: http://storage:8090
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8080:8080"

  redis:
    container_name: redis
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  hermes:
    container_name: hermes
    build:
      context: hermes
    environment:
      STORAGE_URL: http://storage:8090
      REDIS_URL: redis://redis:6379
      POLL_INTERVAL_SECONDS: 5
    depends_on:
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  pythia:
    container_name: oracle
    build:
      context: pythia
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/stats"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8011:8011"

  redpanda:
    container_name: agora
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092, external://0.0.0.0:19092

      - --advertise-kafka-addr internal://redpanda:9092, external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082, external://0.0.0.0:18082
      
      - --advertise-pandaproxy-addr internal://redpanda:8082, external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081, external://0.0.0.0:18081

      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145

      - --mode dev-container

      - --smp 1
      - --default-log-level=info
      - --set redpanda.auto_create_topics_enabled=true
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.10
    volumes:
      - redpanda:/var/lib/redpanda/data

  redpanda-console:
    container_name: argus
    image: docker.redpanda.com/redpandadata/console:v3.7.4
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8085:8080"
    depends_on:
      - redpanda

volumes:
  db_data:
  redis_data:
  redpanda: