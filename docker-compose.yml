services:
  db:
    image: mysql:8
    container_name: db
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 1
      MYSQL_USER: walkr_user
      MYSQL_PASSWORD: walkr_passwd
      MYSQL_DATABASE: walkr_db
      TZ: America/Vancouver
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 12

  storage:
    container_name: storage
    build:
      context: storage
    environment:
      DATABASE_URL: mysql://walkr_user:walkr_passwd@db/walkr_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/status"]
      interval: 5s
      timeout: 5s
      retries: 5

  receiver:
    container_name: receiver
    build:
      context: receiver
    environment:
      STORAGE_SERVICE_URL: http://storage:8090
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/status"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8080:8080"

  redis:
    image: redis:7
    container_name: redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  hermes:
    container_name: hermes
    build:
      context: hermes
    environment:
      STORAGE_URL: http://storage:8090
      REDIS_URL: redis://redis:6379
      POLL_INTERVAL_SECONDS: 5
    depends_on:
      storage:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  pythia:
    container_name: pythia
    build:
      context: pythia
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/stats"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8011:8011"

volumes:
  db_data:
  redis_data: